services:
  web:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./:/app
      - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    environment:
      XDEBUG_CONFIG: remote_host=host.docker.internal
    depends_on:
      - app

  app:
    build:
      context: .
      target: dev
      args:
        HOST_USER_ID: ${HOST_USER_ID:-1000}
        HOST_GROUP_ID: ${HOST_GROUP_ID:-1000}
    depends_on:
      - mysql
    volumes:
      - ./:/app
      - .docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

  worker:
    build:
      context: .
      target: dev
      args:
        HOST_USER_ID: ${HOST_USER_ID:-1000}
        HOST_GROUP_ID: ${HOST_GROUP_ID:-1000}
    command: php artisan queue:work --sleep=1 --max-time=3600
    restart: unless-stopped
    depends_on:
      - mysql
    volumes:
      - ./:/app
      - .docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

  # Websocket server for realtime dashboard updates. The app reaches it at
  # reverb:8080 (REVERB_HOST); browsers connect via the published port
  # (REVERB_CLIENT_HOST/PORT, localhost:8106 by default).
  reverb:
    build:
      context: .
      target: dev
      args:
        HOST_USER_ID: ${HOST_USER_ID:-1000}
        HOST_GROUP_ID: ${HOST_GROUP_ID:-1000}
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    restart: unless-stopped
    ports:
      - "8106:8080"
    depends_on:
      - mysql
    volumes:
      - ./:/app
      - .docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

  mysql:
    image: mariadb:11
    ports:
      - "3306:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=secret
      - MARIADB_DATABASE=app
    volumes:
      - ./storage/tmp/db:/var/lib/mysql:cached
